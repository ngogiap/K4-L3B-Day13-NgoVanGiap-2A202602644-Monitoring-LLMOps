service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "SLO 99.5% trong cửa sổ 28 ngày với ngưỡng latency 3000ms. Error budget là 0.5%. Nếu hệ thống nhận 100,000 request mỗi tháng, chúng ta được phép có tối đa 500 request bị lỗi hoặc trả lời chậm hơn 3 giây trước khi vi phạm SLO và cần dừng tính năng mới để tập trung fix lỗi."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
