alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'latency_p95 > 3000ms'
    duration: '5m'
    type: symptom-based
    channel: '#alerts-llmops'
    owner: 'team-platform'
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'error_rate > 2%'
    duration: '2m'
    type: symptom-based
    channel: '#alerts-llmops-critical'
    owner: 'team-platform'
    runbook: docs/alerts.md#alert-2
  - name: QualityDegradation
    severity: warning
    condition: 'quality_score_avg < 0.75'
    duration: '10m'
    type: symptom-based
    channel: '#alerts-llmops'
    owner: 'team-ai'
    runbook: docs/alerts.md#alert-3
